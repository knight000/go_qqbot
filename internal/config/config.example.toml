# qqbot 配置样例
#
# 这份文件是 `qqbot init` 写出去的模板（内嵌在二进制里），不需要手工复制。
#   本地开发：qqbot init          → 写 config/config.local.toml（已在 .gitignore 中）
#   生产环境：qqbot init -c /etc/qqbot/config.toml（权限 600，属主 qqbot）
# 生成后把 [[bots]] 的 appid 与 secret 填进去即可启动。
#
# 结构分两层（ADR-0008）：[core] 与其余顶层段是进程级基础设施，只有 Core 所有者
# 能改；每个 Bot 的业务面（启用哪些插件、人设、开关默认值）存在它自己的库里。
# 一台机器托管多个 Bot 时只加 [[bots]] 段，不必为每个号维护一份配置与 unit。
#
# 旧的单个 [app] 段仍然可用（按一个 Bot 解析），但不要与 [[bots]] 同时出现：
# 两处都写等于两个来源，校验会直接拒绝。
#
# 认证：[core] 里的端点与 [[bots]] 里的 secret 都直接写本文件，不再依赖
# EnvironmentFile。QQ_APP_ID / QQ_APP_SECRET 仍可用于覆盖，但只在「恰好一个
# Bot」时能表达——多 Bot 时它只覆盖第一个，并在启动日志里告警。

[core]
# Core 所有者：进程级命令（/reload /restart /upgrade /reset all /bot 系列）的
# 唯一授权来源，与某个 Bot 自己库里的 admins 表无关——后者只够管那一个 Bot。
# 填 openid 列表；留空表示这些命令谁都执行不了。
owners = []
# true → sandbox.api.sgroup.qq.com；false → api.sgroup.qq.com
# 进程级：同一台机器上的所有 Bot 连同一套平台环境。
sandbox = true
# 以下留空即用平台默认值（api_base 会按 sandbox 推导）
# api_base   = "https://sandbox.api.sgroup.qq.com"
# token_url  = "https://bots.qq.com/app/getAppAccessToken"

[[bots]]
# 机器人 AppID（QQ 开放平台 → 机器人 → 开发设置）
appid = ""
# 机器人 AppSecret（敏感，勿入 git）
secret = ""
# 缺省 true。false 表示这个 Bot 不连接（状态 suspended）。
enabled = true
# 认证类型：unverified | personal | enterprise，缺省 personal。
# 它决定平台把这个 Bot 的事件推给谁（见 GLOSSARY「认证类型」），核心不做来源判定。
cert_type = "personal"
# 配额档：指向全局配额表，缺省 default（配额表尚未落地，当前只做承载与校验）。
quota_profile = "default"
# 数据目录，缺省为 [store].path 所在目录下的 bots/<appid>/
# data_dir = "./data/bots/102xxxxx"

# 注意这里是单数的 [bot]：网关连接参数，与上面的 [[bots]] 列表无关。
[bot]
# 1<<25 = 33554432，群与单聊（GROUP_AND_C2C_EVENT）
intents = 33554432
shard_total = 1
shard_id = 0
# true → 优先 Resume，省 session 配额
resume = true

[store]
# 数据库与 WAL 必须在本地盘，禁止 tmpfs / 网络盘
# 这里写的是「库文件」路径；每个 Bot 的库落在它所在目录下的 bots/<appid>/ 里
path = "./data/qqbot.db"

[retention]
messages = "168h"   # 7 天
events   = "72h"    # 覆盖 resume 窗口
job_runs = "168h"

[media]
# 保留但未启用：入站媒体（图片/音视频）一律不下载，只记 has_media=1。
# enabled = true 当前不产生任何效果——发图片走的是出站富媒体上传，
# 与这一段配置无关（见 README「发图片」）。
enabled = false
dir = "./data/media"
max_file_bytes = 8388608
quota_bytes = 268435456

[http]
timeout = "5s"
retries = 2
# 默认出站限流（每分钟请求数），对未单独配置额度的域名生效。
# 平台消息接口本身限制 100 QPS，这里默认更保守；业务插件（如 Torn）
# 另受上游 owner 配额约束，那是两层不同的东西（ARCHITECTURE §6）。
rate_per_min = 100

# 按域名分桶：给特定主机名单独配额，未列出的域名继续用 rate_per_min。
# 配了独立额度的域名只使用该桶，不与默认桶叠加；零或负数在启动期被忽略
# 并告警（回退默认值）。同一域名下的所有插件共用一个桶。
# [http.domains]
# "api.torn.com" = 800

[active]
# 主动消息总开关。平台每日额度约 1000 条/用户，本地另设更严的每日预算。
# 只有下面白名单里的插件能发；其余插件调用 SendActive 直接返回"未开启"。
enabled = true
plugins = ["bootnotice"]
# 每 (场景, 收件人) 每日上限。启动通知每次进程启动才发 1 条。
daily_per_peer = 5

[log]
level = "info"    # debug | info | warn | error
format = "text"   # 生产建议 json，对接 journald

[debug]
# 调试模式：把收到的每条事件、命中的插件与回复正文打印到控制台。
# 也可用命令行 -debug 临时打开（会同时把 log.level 降到 debug）。
enabled = false
# 轨迹详细程度：
#   full   —— 收到每条事件（含事件 ID、union）+ 插件命中 + 发送结果（默认）
#   plugin —— 只打印触发插件的内容与真正发出的回复正文
level = "full"
# 额外打印平台原始 JSON，用于排查"某个字段平台到底下发没有"；
# 输出较啰嗦，只在需要时打开，且要求 level = "full"。
raw = false
# 未知事件（平台新推出、本地解码表还没有的事件）附带原始 JSON。
# 用于确认"平台到底推了什么"；未知事件永远不会进入插件路由。
unknown_events = false

# 权限策略：角色与权限点见 README「权限与群准入」一节，这里只控制拒绝时的表现
[permission]
# false（默认）：权限不足时不发任何消息，避免在群里暴露隐藏指令；
# true：发出插件声明的拒绝语，便于调试权限链路。
deny_reply = false

# 群准入：两套开关独立，默认都开启。
# 开启白名单时，只有 /group allow 过的群能进入机器人；黑名单优先于白名单。
# 未放行的群消息在去重、落库、路由之前就被丢弃。
[group]
whitelist = true
blacklist = true
# 首次见到新群 / 收到入群通知时，尝试调用 GET /v2/groups/{id}/info 取群名。
# 该接口目前仅白名单机器人可用（11253），取不到就留空，用 /group name 手工设置。
# 之后可用 /group refresh 批量重试。
fetch_name = true
# 入群/退群通知私聊发给谁：owner（默认，只发所有者）| admin（所有者+管理员）| off。
# 通知走主动消息，受 [active].enabled 与每日预算约束，但不受 [active].plugins 限制。
notify = "owner"

# 自更新（ADR-0006）：/upgrade 是唯一的更新入口，只在人主动敲的时候发请求。
# 启动期不检查、不自愈，也不会未经允许替换二进制。
[upgrade]
# 总开关。false 时连检查都不发请求——不是"检查了但不下载"。
enabled = true
# 元数据通道：index.json 与 checksums.txt **永远**从这里取（GitHub API 端点）。
api_base = "https://api.github.com"
# 二进制通道：可指向镜像站。只在没有 token 时生效。
# 校验和与二进制分两个通道是结构约束，不是约定：镜像被投毒时二进制变了、
# 校验和没变，sha256 必然对不上。
asset_base = "https://github.com"
# 私有仓凭据（细粒度 token，只需 Contents: read）。留空表示仓库匿名可读。
#
# 设了它之后三份产物（index.json / checksums.txt / 二进制）全部改走 api_base
# 的 release asset 端点，因为私有资产无法在镜像上匿名取。反过来，token
# **绝不会**发给 asset_base 的主机——那是用户可配置的镜像，把 GitHub 凭据
# 送过去等于泄露（ADR-0006 决策 13）。
# token = "github_pat_xxx"

# 插件配置：一律放在 [plugins.<name>] 下，由 Host.Config() 读取
[plugins.echo]
reply_prefix = ""

# adminping：/ping 仅管理员可用，权限由 Manifest 声明，无需配置

# bootnotice：启动/重启后主动私聊管理员，报告上线时间与插件清单
[plugins.bootnotice]
enabled = true
# 等网关与 token 就绪再发
delay = "10s"
# 距上次启动不足该间隔则整轮跳过，避免崩溃重启刷屏
min_interval = "10m"
# 发送失败只重试一次（主动消息没有 msg_id 幂等键，多试就是重复推送）
retry_delay = "30s"
